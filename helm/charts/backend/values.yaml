fullname: "backend-service"
replicaCount: 1
image:
  repository: node
  tag: "18-alpine"
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"
service:
  type: ClusterIP
  port: 8080

ingress:
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: production
  className: alb
  host: "backend-service.example.com"

servicemonitor:
  enabled: true
prometheusRule:
  enabled: true

autoscaling:
  enabled: false

db:
  host: "postgres-service"
  port: "5432"
  name: "appdb"

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        preference:
          matchExpressions:
            - key: role
              operator: In
              values:
                - app