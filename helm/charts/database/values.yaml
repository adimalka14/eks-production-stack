postgresql:
  auth:
    database: appdb
    username: appuser
    existingSecret: "db-credentials"
    secretKeys:
      adminPasswordKey: password
      userPasswordKey: password
  primary:
    persistence:
      enabled: true
      storageClass: gp3
      size: 8Gi
    resources:
      requests:
        memory: "512Mi"
        cpu: "500m"
      limits:
        memory: "1Gi"
        cpu: "1"
    tolerations:
      - key: "workload"
        operator: "Equal"
        value: "database"
        effect: "NoSchedule"
    nodeAffinityPreset:
      type: "hard"
      key: "role"
      values:
        - db
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

backup:
  schedule: "0 */6 * * *"
  s3Bucket: "eks-production-stack-db-backups"
  irsaRoleArn: ""  # set from terraform output irsa_backup_role_arn

vpa:
  enabled: true
  updateMode: "Off"
