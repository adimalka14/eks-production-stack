apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-sa
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.backup.irsaRoleArn }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: backup-sa
          initContainers:
            - name: install-awscli
              image: amazon/aws-cli:latest
              command:
                - cp
                - -r
                - /usr/local/aws-cli
                - /tools/
              volumeMounts:
                - name: tools
                  mountPath: /tools
          containers:
            - name: backup
              image: bitnami/postgresql:18.4.0
              env:
                - name: DB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: db-credentials
                      key: host
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: db-credentials
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: db-credentials
                      key: password
                - name: DB_NAME
                  value: {{ .Values.postgresql.auth.database }}
                - name: S3_BUCKET
                  value: {{ .Values.backup.s3Bucket }}
              command:
                - /bin/bash
                - -c
                - |
                  pg_dump -h $DB_HOST -U $DB_USER $DB_NAME | \
                  gzip | /tools/aws-cli/v2/current/bin/aws s3 cp - \
                  s3://${S3_BUCKET}/backups/db-$(date +%Y%m%d-%H%M%S).sql.gz
              volumeMounts:
                - name: tools
                  mountPath: /tools
          volumes:
            - name: tools
              emptyDir: {}
          restartPolicy: OnFailure
