apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-sa
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.backup.irsaRoleArn }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: backup-sa
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: role
                        operator: In
                        values:
                          - app
          initContainers:
            - name: install-awscli
              image: amazon/aws-cli:latest
              command:
                - /bin/sh
                - -c
                - |
                  cp -r /usr/local/aws-cli /tools/ && \
                  ln -sfn /tools/aws-cli/v2/$(ls /tools/aws-cli/v2/ | grep -v current) /tools/aws-cli/v2/current
              volumeMounts:
                - name: tools
                  mountPath: /tools
          containers:
            - name: backup
              image: public.ecr.aws/bitnami/postgresql:18.4.0
              env:
                - name: HOME
                  value: /tmp
                - name: DB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: db-credentials
                      key: host
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: db-credentials
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: db-credentials
                      key: password
                - name: DB_NAME
                  value: {{ .Values.postgresql.auth.database }}
                - name: S3_BUCKET
                  value: {{ .Values.backup.s3Bucket }}
                - name: AWS_ROLE_ARN
                  value: {{ .Values.backup.irsaRoleArn }}
                - name: AWS_WEB_IDENTITY_TOKEN_FILE
                  value: /var/run/secrets/eks.amazonaws.com/serviceaccount/token
              command:
                - /bin/bash
                - -c
                - |
                  pg_dump -h $DB_HOST -U $DB_USER $DB_NAME | \
                  gzip | /tools/aws-cli/v2/current/bin/aws s3 cp - \
                  s3://${S3_BUCKET}/backups/db-$(date +%Y%m%d-%H%M%S).sql.gz
              volumeMounts:
                - name: tools
                  mountPath: /tools
          volumes:
            - name: tools
              emptyDir: {}
          restartPolicy: OnFailure
