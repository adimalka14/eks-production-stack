# Tolerations for the system node group taint (CriticalAddonsOnly=true:NoSchedule)
# Without this, ALL prometheus/grafana pods get stuck in Pending forever
_tolerations: &tolerations
  - key: CriticalAddonsOnly
    operator: Equal
    value: "true"
    effect: NoSchedule

prometheus:
  prometheusSpec:
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2   # gp3 does not exist; only gp2 is available on this cluster
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    serviceMonitorSelectorNilUsesHelmValues: false
    tolerations: *tolerations

alertmanager:
  alertmanagerSpec:
    tolerations: *tolerations

grafana:
  tolerations: *tolerations
  enabled: true
  adminPassword: "123456"
  sidecar:
    dashboards:
      enabled: true
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      node-exporter:
        gnetId: 1860    # Node Exporter Full
        revision: 37
        datasource: Prometheus
      kubernetes-pods:
        gnetId: 6417    # Kubernetes pods
        revision: 1
        datasource: Prometheus
      postgresql:
        gnetId: 9628    # PostgreSQL Database
        revision: 7
        datasource: Prometheus
      nodejs-app:
        gnetId: 11159   # Node.js Application (prom-client)
        revision: 1
        datasource: Prometheus

prometheusOperator:
  tolerations: *tolerations
  admissionWebhooks:
    patch:
      tolerations: *tolerations

kube-state-metrics:
  tolerations: *tolerations

prometheus-node-exporter:
  tolerations: *tolerations

kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
