apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: db-credentials
  data:
    - secretKey: username
      remoteRef:
        key: my-app/production/db-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: my-app/production/db-credentials
        property: password
    - secretKey: host
      remoteRef:
        key: my-app/production/db-credentials
        property: host
    - secretKey: port
      remoteRef:
        key: my-app/production/db-credentials
        property: port
    - secretKey: database
      remoteRef:
        key: my-app/production/db-credentials
        property: database
    - secretKey: postgres-password
      remoteRef:
        key: my-app/production/db-credentials
        property: password
